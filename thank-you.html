  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4F1FPHEDGM"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4F1FPHEDGM');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <header class="masthead"><div class="shell"><a class="brand" href="/">Mutual <span>Solutions</span></a></div></header>
  <main class="hero"><div class="shell" style="max-width:700px"><div class="eyebrow">Request received</div><h1>Thank you. We will be in touch.</h1><p class="lead">Your request has been sent to Mutual Solutions. If you need to speak with us sooner, call 0800 67 55 55.</p><a class="button" href="/" style="max-width:260px">Return to the website</a></div></main>
  <footer class="footer"><div class="shell"><p>Mutual Solutions Limited · FSP 729871 · Level 2, 26 Broadway Avenue, Palmerston North 4410</p></div></footer>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var source = params.get('source') || 'paid_landing_page';
    var submissionId = params.get('submission_id') || '';
    gtag('event', 'lead_confirmation_view', {
      lead_source: source,
      submission_id: submissionId
    });
    if (!submissionId || params.get('tracked') === '1') return;
    var pendingKey = 'mutuals_pending_lead_' + submissionId;
    var trackedKey = 'mutuals_tracked_lead_' + submissionId;
    try {
      if (window.sessionStorage.getItem(trackedKey)) return;
      var leadContext = JSON.parse(window.sessionStorage.getItem(pendingKey) || 'null');
      if (!leadContext || leadContext.submission_id !== submissionId) return;
      gtag('event', 'generate_lead', Object.assign({
        transport_type: 'beacon',
        event_id: 'lead_' + submissionId
      }, leadContext));
      window.sessionStorage.setItem(trackedKey, '1');
      window.sessionStorage.removeItem(pendingKey);
    } catch (error) {
      // Never count an unverified direct visit to this private page as a lead.
    }
  })();
  </script>
</body>
</html>
