name: Notify IndexNow after publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test notification safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Wait for live publication and notify search engines
        env:
          INDEXNOW_BASE: ${{ github.event.before }}
          INDEXNOW_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/indexnow.py
