name: Notify IndexNow after publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test notification safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Wait for live publication and notify search engines
        env:
          INDEXNOW_BASE: ${{ github.event.before }}
          INDEXNOW_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/indexnow.py
